<html>
<body>

<h1>THN Access Portal</h1>

<input id="chiave" placeholder="THN Key">

<button onclick="entra()">
Entra
</button>

<script>

function entra() {

let inserita =
document.getElementById("chiave").value;

if (
inserita ==
localStorage.getItem("thnkey")
) {

document.write(
"<h1>Welcome tu THN</h1>"
"<h2>Choose the WebBox you want to connect to</h2>"
);

}

else {

alert("Invalid password");

}

}

</script>

</body>
</html>
